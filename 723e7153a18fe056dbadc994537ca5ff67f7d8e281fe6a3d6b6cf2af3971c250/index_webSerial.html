<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Serial COM Port Terminal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Web Serial COM Port Terminal</h1>

    <section id="connection">
      <h2>Connection</h2>
      <div id="connectionStatus">Disconnected</div>

      <div class="controls">
        <button id="connect">Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
      </div>

      <div class="actions">
        <button id="clear">Clear</button>
        <button id="saveLog">Save Log</button>
      </div>

      <p class="tip">Tip: Press Enter to send.</p>
    </section>

    <section id="terminal">
      <h2>Terminal</h2>
      <div>
        <label><input type="checkbox" id="showTimestamps"> Show timestamps</label>
      </div>

      <div id="terminalOutput"></div>

      <div class="input">
        <input type="text" id="sendInput" placeholder="Send">
      </div>
    </section>

    <div id="apiStatus">Web Serial API status…</div>
  </div>

  <script src="js/webSerial.js"></script>
  <script>
    const terminal = new SerialTerminal();
    let port = null;

    // Fixed constants for serial connection
    const BAUD_RATE = 115200;
    const DATA_BITS = 8;
    const PARITY = 'none';
    const STOP_BITS = 1;
    const FLOW_CONTROL = 'none';

    // New function to handle onDataArrival event
    function handleDataArrival(data) {
      const terminalOutput = document.getElementById('terminalOutput');
      const showTimestamps = document.getElementById('showTimestamps').checked;
      const timestamp = showTimestamps ? `[${new Date().toLocaleTimeString()}] ` : '';
      terminalOutput.textContent += `${timestamp}${data}\n`;
      terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    // Initialize API status
    if (!('serial' in navigator)) {
      document.getElementById('apiStatus').textContent = 'Web Serial API not supported in this browser.';
    } else {
      document.getElementById('apiStatus').textContent = 'Web Serial API is supported.';
    }

    // Event listeners
    document.getElementById('connect').addEventListener('click', async () => {
      try {
        await terminal.connect(BAUD_RATE, DATA_BITS, PARITY, STOP_BITS, FLOW_CONTROL);
        document.getElementById('connect').disabled = true;
        document.getElementById('disconnect').disabled = false;
        document.getElementById('connectionStatus').textContent = 'Connected';
        terminal.setOnDataArrival(handleDataArrival);
      } catch (error) {
        document.getElementById('connectionStatus').textContent = `Connection error: ${error.message}`;
      }
    });

    document.getElementById('disconnect').addEventListener('click', async () => {
      try {
        await terminal.disconnect();
        document.getElementById('connect').disabled = false;
        document.getElementById('disconnect').disabled = true;
        document.getElementById('connectionStatus').textContent = 'Disconnected';
      } catch (error) {
        document.getElementById('connectionStatus').textContent = `Disconnection error: ${error.message}`;
      }
    });

    document.getElementById('sendInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const sendInput = document.getElementById('sendInput');
        terminal.sendData(sendInput.value + '\n').then(() => {
          sendInput.value = '';
        }).catch(error => {
          document.getElementById('connectionStatus').textContent = `Send error: ${error.message}`;
        });
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      document.getElementById('terminalOutput').textContent = '';
    });

    document.getElementById('saveLog').addEventListener('click', () => {
      const blob = new Blob([document.getElementById('terminalOutput').textContent], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'terminal_log.txt';
      a.click();
    });
  </script>
</body>
</html>
